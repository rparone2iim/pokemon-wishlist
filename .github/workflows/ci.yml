name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push annule la pipeline encore en cours sur la même branche
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run format:check

  # Traductions : chaque fichier de langue doit avoir les clés de en.json,
  # côté front (apps/web/i18n/locales) et côté back (apps/api/src/locales)
  i18n:
    name: Traductions (clés des locales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Le script n'utilise que Node : pas besoin de npm ci
      - name: Tests du script
        run: npm run test:scripts
      - name: Clés des locales comparées à en.json
        run: npm run i18n:check

  # Contrôles de chaque app du monorepo (apps/web et apps/api)
  checks:
    name: ${{ matrix.app }} · ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
        check:
          - { name: Lint (ESLint), script: lint }
          - { name: Typecheck (TypeScript), script: typecheck }
          - { name: Tests (Vitest), script: test }
        # Les tests de l'API ont besoin d'une base : job test-api ci-dessous
        exclude:
          - app: api
            check: { name: Tests (Vitest), script: test }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run ${{ matrix.check.script }} -w apps/${{ matrix.app }}

  # Tests d'intégration de l'API : les routes tournent sur une vraie base
  # PostgreSQL de test (conteneur), sans mock SQL
  test-api:
    name: api · Tests (Vitest + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokewishlist_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokewishlist_test
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run test -w apps/api

  # Les builds ne se lancent que si tous les contrôles sont verts
  build-web:
    name: web · Build
    needs: [format, i18n, checks, test-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build -w apps/web

  build-api:
    name: api · Build
    needs: [format, i18n, checks, test-api]
    runs-on: ubuntu-latest
    # Une vraie base PostgreSQL, vide, rien que pour ce job
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokewishlist
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokewishlist
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: npm run build -w apps/api

      - name: Paquet AWS Lambda (esbuild)
        run: npm run build:lambda -w apps/api

      - name: Schéma de la base (db/init.sql)
        run: npm run db:init -w apps/api

      - name: GET /health renvoie 200
        working-directory: apps/api
        run: |
          PORT=3001 node dist/index.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:3001/health && break
            sleep 0.5
          done
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health)" = 200

  # Tests end-to-end : la CI démarre Hono et Nuxt, puis lance Playwright.
  # Ce job tourne en parallèle des autres : une réponse d'API cassée
  # le fait passer au rouge même si un autre contrôle échoue aussi.
  e2e:
    name: web · Tests E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      # Ports et adresses : les mêmes que dans apps/web/playwright.config.ts
      WEB_URL: http://localhost:4000
      API_URL: http://localhost:4001
      POKEAPI_URL: http://localhost:4002/api/v2
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pokewishlist
      # Fiches prégénérées au build (et testées) : les 3 premières de la fausse PokéAPI
      PRERENDER_POKEMON: 3
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pokewishlist
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Build de Hono
        run: npm run build -w apps/api

      - name: Schéma de la base (db/init.sql)
        run: npm run db:init -w apps/api

      - name: Démarrer la fausse PokéAPI et Hono
        run: |
          # Fausse PokéAPI : les tests ne dépendent pas d'Internet
          PORT=4002 node apps/web/e2e/mock-pokeapi.mjs > pokeapi.log 2>&1 &
          # API Hono, branchée sur PostgreSQL (DATABASE_URL)
          PORT=4001 CORS_ORIGIN=$WEB_URL POKEAPI_URL=$POKEAPI_URL \
            node apps/api/dist/index.js > hono.log 2>&1 &
          for url in http://localhost:4002/health $API_URL/health; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null && echo "✔ $url répond"
          done

      # Build après Hono : les 3 premières fiches sont prégénérées avec la vraie API
      - name: Build de Nuxt (avec fiches prégénérées)
        run: npm run build -w apps/web
        env:
          PRERENDER_POKEAPI_URL: ${{ env.POKEAPI_URL }}
          NUXT_PUBLIC_API_BASE: ${{ env.API_URL }}

      - name: Démarrer Nuxt
        run: |
          PORT=4000 NUXT_PUBLIC_API_BASE=$API_URL \
            node apps/web/.output/server/index.mjs > nuxt.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$WEB_URL" > /dev/null && break; sleep 1; done
          curl -sf "$WEB_URL" > /dev/null && echo "✔ $WEB_URL répond"

      - name: Playwright
        run: npm run test:e2e
        env:
          # Les serveurs tournent déjà : Playwright les utilise tels quels
          E2E_SERVERS_STARTED: '1'

      - name: Logs des serveurs
        if: failure()
        run: tail -n 50 pokeapi.log hono.log nuxt.log

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # CD : l'API part sur AWS Lambda quand toute la CI est verte, uniquement pour
  # un push sur main (un merge de PR). Connexion à AWS par OIDC : aucune clé AWS
  # dans GitHub, un rôle qui ne peut que remplacer le code de cette Lambda.
  # La configuration (DATABASE_URL, CORS_ORIGIN) reste sur AWS, jamais dans GitHub.
  deploy-api:
    name: api · Déploiement AWS Lambda
    needs: [format, i18n, checks, test-api, build-web, build-api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: ${{ vars.API_URL }}/health
    permissions:
      contents: read
      id-token: write # jeton OIDC pour AWS
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-3
      FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
      API_URL: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Connexion à AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_API_ROLE_ARN }}
          aws-region: eu-west-3

      # GITHUB_SHA est figé dans le paquet : /health renverra ce commit
      - name: Paquet AWS Lambda (esbuild)
        run: |
          npm run build:lambda
          (cd dist-lambda && zip -qr function.zip lambda db)

      - name: Mise à jour du code de la Lambda
        run: |
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://dist-lambda/function.zip \
            --query '{version: Version, sha256: CodeSha256}' --output text
          aws lambda wait function-updated --function-name "$FUNCTION"

      - name: L'API en ligne sert bien ce commit
        run: |
          expected=${GITHUB_SHA::7}
          for i in $(seq 1 20); do
            health=$(curl -sf "$API_URL/health" || true)
            echo "$health" | grep -q "\"version\":\"$expected\"" && break
            sleep 3
          done
          echo "$health"
          echo "$health" | grep -q "\"version\":\"$expected\""
          test "$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/wishlist")" = 200
          echo "✔ $API_URL sert la version $expected, /wishlist répond 200"

  # CD : le front part en production sur Vercel (SSR) quand toute la CI est
  # verte, uniquement pour un push sur main (un merge de PR).
  deploy-web:
    name: web · Déploiement Vercel (production)
    needs: [format, i18n, checks, test-api, build-web, build-api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pokewishlist-8bit.vercel.app
    # Un seul déploiement à la fois, jamais annulé en plein milieu
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SITE_URL: https://pokewishlist-8bit.vercel.app
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Réglages du projet Vercel (production)
        run: npx vercel@65.10.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Le build est fait ici (preset Nitro « vercel ») ; GITHUB_SHA devient la version affichée
      - name: Build Nuxt SSR pour Vercel
        run: npx vercel@65.10.0 build --prod --token="$VERCEL_TOKEN"
        env:
          # Nitro produit directement le format attendu par Vercel (.vercel/output)
          NITRO_PRESET: vercel
          # Les 151 premières fiches Pokémon sont prégénérées en HTML au build
          PRERENDER_POKEMON: 151

      - name: Déploiement en production
        run: npx vercel@65.10.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Le site en ligne sert bien ce commit, en SSR
        run: |
          expected=${GITHUB_SHA::7}
          for i in $(seq 1 20); do
            html=$(curl -sf "$SITE_URL/pokemon/pikachu" || true)
            echo "$html" | grep -q "name=\"app-version\" content=\"$expected\"" && break
            sleep 3
          done
          echo "$html" | grep -q "name=\"app-version\" content=\"$expected\""
          echo "$html" | grep -qi '<h1 id="fiche-25"'
          echo "✔ $SITE_URL sert la version $expected, fiche Pikachu rendue par le serveur"

  # CD : le site statique (SSG) part sur S3 + CloudFront quand toute la CI est
  # verte, uniquement pour un push sur main. Connexion à AWS par OIDC : aucune
  # clé AWS dans GitHub, un rôle limité à ce bucket et à cette distribution.
  deploy-ssg:
    name: web · Déploiement statique S3 + CloudFront
    needs: [format, i18n, checks, test-api, build-web, build-api, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-ssg
      url: ${{ vars.SSG_URL }}
    permissions:
      contents: read
      id-token: write # jeton OIDC pour AWS
    concurrency:
      group: deploy-ssg-production
      cancel-in-progress: false
    env:
      AWS_REGION: eu-west-3
      BUCKET: ${{ vars.SSG_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.SSG_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SSG_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Connexion à AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_SSG_ROLE_ARN }}
          aws-region: eu-west-3

      # 1. generate : le site statique, branché sur l'API AWS, 151 fiches prégénérées
      - name: Génération statique (nuxt generate)
        run: npm run generate -w apps/web
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.API_URL }}
          PRERENDER_POKEMON: 151

      # 2. sync S3 : fichiers du build gardés un an, pages toujours revalidées
      - name: Envoi sur S3
        working-directory: apps/web/.output/public
        run: |
          aws s3 sync _nuxt "s3://$BUCKET/_nuxt" --delete --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync . "s3://$BUCKET" --delete --only-show-errors \
            --exclude "_nuxt/*" --cache-control "public, max-age=0, must-revalidate"

      # 3. invalidation CloudFront : le CDN sert tout de suite la nouvelle version
      - name: Invalidation du cache CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query Invalidation.Id --output text)
          echo "Invalidation $id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Le site statique sert bien ce commit
        run: |
          expected=${GITHUB_SHA::7}
          html=$(curl -sf "$SITE_URL/pokemon/pikachu")
          echo "$html" | grep -q "name=\"app-version\" content=\"$expected\""
          echo "$html" | grep -q '<h1 id="fiche-25"'
          echo "✔ $SITE_URL sert la version $expected (fiche Pikachu générée)"

  # Smoke tests : une fois l'API, le SSR et le SSG déployés, la production
  # répond-elle ? /health, /wishlist, l'accueil, une fiche SSR, une fiche SSG,
  # les fichiers JS du build et les codes HTTP (dont un vrai 404 en SSR).
  # Une URL critique qui ne répond pas fait échouer la CD.
  smoke:
    name: Smoke tests de la production
    needs: [deploy-api, deploy-web, deploy-ssg]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Le script n'utilise que Node : pas besoin de npm ci
      - name: API, SSR et SSG en ligne, sur ce commit
        run: npm run smoke
        env:
          API_URL: ${{ vars.API_URL }}
          SSR_URL: https://pokewishlist-8bit.vercel.app
          SSG_URL: ${{ vars.SSG_URL }}
          EXPECTED_VERSION: ${{ github.sha }}

      # SEO : le HTML brut (sans JavaScript) des fiches, en SSR et en SSG
      - name: SEO · fiches lisibles sans JavaScript (SSR et SSG)
        run: npm run seo:html
        env:
          SSR_URL: https://pokewishlist-8bit.vercel.app
          SSG_URL: ${{ vars.SSG_URL }}
